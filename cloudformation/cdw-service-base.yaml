Outputs:
  KMSKeyArn:
    Description: Identifier for the issued KMS key
    Value: !If [EncryptionKeyNotSpecified, !Ref KMSKey, !Ref EncryptionKeyARN]

  EFSId:
    Description: Identifier for the provisioned EFS
    Value: !Ref EFS

  PrivateSubnetIds:
    Description: All private subnets created in the VPC
    Value: !Join [ ",", !If [CreateVPC, [ !Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3 ],  [ !Ref CustomSubnet1, !Ref CustomSubnet2, !Ref CustomSubnet3 ] ]]

  PublicSubnetIds:
    Description: All public subnets created in the VPC
    Value: !Join [ ",", !If [CreateVPC, [ !Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3 ],  [ "" ] ]]

  SecurityGroups:
    Description: Security group for the cluster control plane communication with worker nodes
    Value: !Join [ ",", [ !Ref ClusterControlPlaneSecurityGroup ]]

  VpcId:
    Description: The VPC Id
    Value: !If [CreateVPC, !Ref VPC, !Ref CustomVpc]

  VpcCidrBlock:
    Description: Cidr block of VPC
    Value: !If [CreateVPC, !GetAtt VPC.CidrBlock, !Ref VpcCIDRBlock]

  EKSServiceRoleArn:
    Description: The role that EKS will use to create AWS resources for Kubernetes clusters
    Value: !GetAtt EKSServiceRole.Arn

  NodeInstanceRoleArn:
    Description: The node instance role for EKS worker nodes
    Value: !GetAtt NodeInstanceRole.Arn

  RDSInstanceId:
    Description: The connection endpoint for the database.
    Value: !Ref DBInstance

  EKSClusterName:
    Description: Identifier for the EKS cluster.
    Value: !Ref EKSCluster

  RDSEndpoint:
    Description: The connection endpoint for the database.
    Value: !GetAtt DBInstance.Endpoint.Address

  EKSClusterCA:
    Description: Certificate Authority Data for the EKS cluster.
    Value: !GetAtt EKSCluster.CertificateAuthorityData

  EKSClusterEndpoint:
    Description: Endpoint for the EKS control plane.
    Value: !GetAtt EKSCluster.Endpoint

  EKSClusterResourceArn:
    Description: Identifier for the EKS cluster.
    Value: !GetAtt EKSCluster.Arn.        ,