                --BOUNDARY--
              - UserDataFromMap: !FindInMap [ Common, UserData, Value ]
                ResourceName: SpotComputeNodeGroupSubnet3r7gd4xlarge
                ExtraArgsFromMap: !FindInMap [ Common, ExtraArgs, SpotComputeNodeGroup ]
                EksClusterCa: !GetAtt EKSCluster.CertificateAuthorityData
                ApiServerEndpoint: !GetAtt EKSCluster.Endpoint
                ProxyUserDataFromMap: !If [UseProxy, !FindInMap [ Common, ProxyData, Value ], '']
                ProxyParameter: !If [UseProxy, '--https-proxy $PROXY', '']
                ProxyEnvironmentVar: !If [UseProxy, !Join [ "", [  'PROXY=', !Ref Proxy ] ], '']
                NoProxyEnvironmentVar: !If [UseProxy, !Join [ "", [  'NOPROXY=', !Ref NoProxy ] ], '']
