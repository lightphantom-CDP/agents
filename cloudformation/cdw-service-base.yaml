          Name: !Ref NodeInstanceProfile
        ImageId: !Ref EksImageIdSSMParamARM
        InstanceType: r7gd.4xlarge
        KeyName: !Ref KeyName
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              Fn::If:
                - EncryptionKeyNotSpecified
                - VolumeSize: !Ref NodeVolumeSize
                  VolumeType: gp3
                  DeleteOnTermination: true
                  Encrypted: true
                  KmsKeyId: !GetAtt KMSKey.Arn
                - VolumeSize: !Ref NodeVolumeSize
