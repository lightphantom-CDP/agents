  SpotComputeNodeLaunchTemplateSubnet1r6gd4xlarge:
    Type: AWS::EC2::LaunchTemplate
    Condition: SpotInstancesEnabled
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-spot-compute-subnet-1-launch-template-r6gd.4xlarge"
      LaunchTemplateData:
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: !Ref AssociatePublicIpAddress
            Groups:
              - !Ref NodeSecurityGroup
        IamInstanceProfile:
          Name: !Ref NodeInstanceProfile
        ImageId: !Ref EksImageIdSSMParamARM
        InstanceType: r6gd.4xlarge
        KeyName: !Ref KeyName
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              Fn::If:
                - EncryptionKeyNotSpecified
                - VolumeSize: !Ref NodeVolumeSize
                  VolumeType: gp3
                  DeleteOnTermination: true
                  Encrypted: true
                  KmsKeyId: !GetAtt KMSKey.Arn
                - VolumeSize: !Ref NodeVolumeSize
                  VolumeType: gp3
                  DeleteOnTermination: true
                  Encrypted: true
                  KmsKeyId: !Ref EncryptionKeyARN
        InstanceMarketOptions:
          MarketType: spot
          SpotOptions:
            MaxPrice: !Ref SpotPrice
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                MIME-Version: 1.0
                Content-Type: multipart/mixed; boundary="BOUNDARY"
        
                --BOUNDARY
                Content-Type: application/node.eks.aws
        
                ---
                apiVersion: node.eks.aws/v1alpha1
                kind: NodeConfig
                spec:
                  cluster:
                    name: ${AWS::StackName}-eks
                    apiServerEndpoint: ${ApiServerEndpoint}
                    certificateAuthority: ${EksClusterCa}
                    cidr: 172.20.0.0/16
                  kubelet:
                    config:
                      apiVersion: kubelet.config.k8s.io/v1beta1
                      kind: KubeletConfiguration
                      clusterDNS:
                        - 169.254.20.10
                      cpuCFSQuota: false
                      allowedUnsafeSysctls:
                        - net.core.somaxconn
                        - net.ipv4.tcp_max_syn_backlog
                        - net.ipv4.tcp_fin_timeout
                      maxPods: 15
                      registerWithTaints:
                      - key: "computeId"
                        value: "unassigned"
                        effect: "NoSchedule"
                    flags:
                      - --node-labels=primary-compute-instance-type=${Itype},compute=true,node.kubernetes.io/spot-compute=role,lifecycle=ec2-spot,computeId=unassigned
                --BOUNDARY
                Content-Type: text/x-shellscript; charset="us-ascii"
                
                ${UserDataFromMap}
                ${ProxyEnvironmentVar}
                ${NoProxyEnvironmentVar}
                ${ProxyUserDataFromMap}
                /opt/aws/bin/cfn-signal --exit-code $? --stack ${AWS::StackName} --resource ${ResourceName} --region ${AWS::Region} ${ProxyParameter}
        
                --BOUNDARY--
              - UserDataFromMap: !FindInMap [ Common, UserData, Value ]
                ResourceName: SpotComputeNodeGroupSubnet1r6gd4xlarge
                ExtraArgsFromMap: !FindInMap [ Common, ExtraArgs, SpotComputeNodeGroup ]
                EksClusterCa: !GetAtt EKSCluster.CertificateAuthorityData
                ApiServerEndpoint: !GetAtt EKSCluster.Endpoint
                ProxyUserDataFromMap: !If [UseProxy, !FindInMap [ Common, ProxyData, Value ], '']
                ProxyParameter: !If [UseProxy, '--https-proxy $PROXY', '']
                ProxyEnvironmentVar: !If [UseProxy, !Join [ "", [  'PROXY=', !Ref Proxy ] ], '']
                NoProxyEnvironmentVar: !If [UseProxy, !Join [ "", [  'NOPROXY=', !Ref NoProxy ] ], '']
                Itype: r6gd.4xlarge
        MetadataOptions:
          HttpPutResponseHopLimit: 2
          HttpEndpoint: enabled
          HttpTokens: !If
            - IMDSv1Disabled
            - required
            - optional
    DependsOn: EKSCluster

