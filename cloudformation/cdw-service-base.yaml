  DevModeComputeNodeGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: DevModeEnabled
    Properties:
      AutoScalingGroupName: "env-6l77vh-dwx-stack-eks-dev-mode-compute-asg"
      LaunchTemplate:
        LaunchTemplateId: !Ref DevModeComputeNodeLaunchTemplate
        Version: !GetAtt 'DevModeComputeNodeLaunchTemplate.LatestVersionNumber'
      MinSize: !Ref MinComputeNodeCount
      MaxSize: !Ref MaxComputeNodeCount
      Cooldown: 0
      DesiredCapacity: !Ref DesiredComputeNodeCount
      PlacementGroup: !Ref DevComputePlacementGroup
      # removing multiple subnets for devcompute to fix the 5min start up delay.
      # for devmode, AZ spreading is not done (if required ASGs have to be splitted up into 1 per subnet).
      VPCZoneIdentifier:
        - !If [CreateVPC, !Ref PrivateSubnet1, !Ref CustomSubnet1]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-eks-dev-mode-compute-node"
          PropagateAtLaunch: 'true'
        - Key: !Sub 'kubernetes.io/cluster/${AWS::StackName}-eks'
          Value: 'shared'
          PropagateAtLaunch: 'true'
        - Key: "k8s.io/cluster-autoscaler/enabled"
          Value: 'true'
          PropagateAtLaunch: 'true'
        - Key: !Sub "k8s.io/cluster-autoscaler/${AWS::StackName}-eks"
          Value: 'true'
          PropagateAtLaunch: 'true'
        - Key: "k8s.io/cluster-autoscaler/node-template/label/devcompute"
          Value: 'true'
          PropagateAtLaunch: 'true'
        - Key: "k8s.io/cluster-autoscaler/node-template/resources/ephemeral-storage"
          Value: !Join [ "", [ !Ref NodeVolumeSize, 'G' ] ]
          PropagateAtLaunch: 'true'
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: '1'
        MaxBatchSize: '1'
        SuspendProcesses:
          - AZRebalance

