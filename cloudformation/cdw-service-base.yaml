                apiVersion: node.eks.aws/v1alpha1
                kind: NodeConfig
                spec:
                  cluster:
                    name: ${AWS::StackName}-eks
                    apiServerEndpoint: ${ApiServerEndpoint}
                    certificateAuthority: ${EksClusterCa}
                    cidr: 172.20.0.0/16
                  kubelet:
                    config:
                      apiVersion: kubelet.config.k8s.io/v1beta1
                      kind: KubeletConfiguration
                      clusterDNS:
                        - 169.254.20.10
                      cpuCFSQuota: false
                      allowedUnsafeSysctls:
                        - net.core.somaxconn
                        - net.ipv4.tcp_max_syn_backlog
                        - net.ipv4.tcp_fin_timeout
                      maxPods: 15
                      registerWithTaints:
                      - key: "computeId"
                        value: "unassigned"
                        effect: "NoSchedule"
                    flags:
                      - --node-labels=primary-compute-instance-type=${Itype},compute=true,node.kubernetes.io/spot-compute=role,lifecycle=ec2-spot,computeId=unassigned
