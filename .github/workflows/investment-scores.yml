name: Investment timing scores

# Runs the Buffett-lens scorer on a schedule so you get a fresh read every hour.
# Results appear in the run's "Summary" tab and as a downloadable SNAPSHOT.md
# artifact. No API keys or secrets are used (data comes from public endpoints).
#
# Note: GitHub only runs `schedule` triggers on the default branch, so the
# hourly cron takes effect once this is merged to `main`. Use the "Run workflow"
# button (workflow_dispatch) to try it from any branch on demand.

on:
  schedule:
    - cron: "0 * * * *"   # top of every hour (UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: investment-scores
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scorer (writes job summary + SNAPSHOT.md)
        run: python -m investment_scorer --markdown investment_scorer/SNAPSHOT.md

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-snapshot
          path: investment_scorer/SNAPSHOT.md
          if-no-files-found: warn
