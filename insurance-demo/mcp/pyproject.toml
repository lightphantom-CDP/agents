[project]
name = "leon-hospital-notify-mcp"
version = "0.1.0"
description = "Leon Hospital manual-review notifications via ntfy.sh (MCP server)"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0,<2",
  "requests>=2.31.0",
  "pydantic>=2.0.0",
]

[project.scripts]
leon-hospital-notify = "notify_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = ["notify_server", "notify_lib"]
